<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The device, in the app's own palette: shell, recessed well, DMG green panel. -->
  <rect width="32" height="32" rx="4" fill="#2a2721" />
  <rect x="6" y="5" width="20" height="18" rx="1.5" fill="#17150f" />
  <rect x="8" y="7" width="16" height="14" fill="#9bbc0f" />
  <!-- Two scanline bands, so it still reads as a screen at 16px. -->
  <rect x="8" y="11" width="16" height="2" fill="#306230" opacity="0.7" />
  <rect x="8" y="16" width="16" height="2" fill="#306230" opacity="0.45" />
  <!-- Power lamp, in the signal colour. -->
  <circle cx="9" cy="27" r="1.6" fill="#c23b13" />
</svg>
